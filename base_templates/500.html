{% extends "global/base.html" %} {% load static %} {% block content %}
<section class="min-h-screen flex items-center justify-center px-8 py-12">
  <div class="w-full max-w-md text-center">
    <img
      src="{% static 'images/logo.svg' %}"
      alt="AniverLembre Logo"
      class="w-20 mx-auto mb-6"
    />

    <p class="text-7xl font-bold text-indigo-500 mb-2">500</p>
    <h1 class="text-2xl font-bold mb-2">Algo deu errado</h1>
    <p class="text-gray-500 dark:text-gray-400 mb-8">
      Tivemos um problema inesperado no servidor. Tente novamente em alguns
      instantes.
    </p>

    <a
      href="/"
      class="inline-flex items-center gap-2 px-6 py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white font-semibold transition"
    >
      <span class="material-symbols-outlined text-lg">arrow_back</span>
      Voltar para o início
    </a>
  </div>
</section>
{% endblock content %}
