<!DOCTYPE html>
<html lang="pt-br">
  <head>
    {% include "partials/_head.html" %}
  </head>
  <body
    class="font-sans bg-[var(--bg)] text-[var(--ink)] transition-colors duration-200"
  >
    {% block content %}{% endblock content %}

    {% block floating_theme %}
    <button
      type="button"
      data-theme-toggle
      aria-label="Alternar tema claro/escuro"
      class="fixed bottom-4 right-4 z-50 w-12 h-12 rounded-full bg-[var(--surface)] shadow-outline shadow-lg flex items-center justify-center text-[var(--muted)] hover:scale-105 active:scale-95 transition-transform"
    >
      <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
      <i data-lucide="sun" class="w-5 h-5 hidden dark:inline"></i>
    </button>
    {% endblock floating_theme %}
  </body>
</html>
