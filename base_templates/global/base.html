<!DOCTYPE html>
<html lang="pt-br">
  <head>
    {% include "partials/_head.html" %}
  </head>
  <body
    class="inter bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200"
  >
    {% block content %}{% endblock content %}

    <button
      type="button"
      id="themeToggle"
      aria-label="Alternar tema claro/escuro"
      class="fixed bottom-4 right-4 z-50 w-12 h-12 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-lg flex items-center justify-center text-gray-600 dark:text-gray-300 hover:scale-105 active:scale-95 transition-transform"
    >
      <span class="material-symbols-outlined text-xl dark:hidden">dark_mode</span>
      <span class="material-symbols-outlined text-xl hidden dark:inline">light_mode</span>
    </button>

    <script>
      (function () {
        const toggle = document.getElementById('themeToggle');
        if (!toggle) return;

        toggle.addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          try {
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
          } catch (e) {}
        });
      })();
    </script>
  </body>
</html>
