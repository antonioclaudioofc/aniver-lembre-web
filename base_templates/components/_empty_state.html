{% load static %}
<div class="flex flex-col items-center text-center py-12 px-4">
  <img src="{% static 'images/birthday-cake.svg' %}" alt="" class="w-40 sm:w-44 mb-6" />
  <p class="font-display text-xl font-semibold text-[var(--ink)]">{{ title }}</p>
  {% if text %}<p class="text-[var(--muted)] mt-1 max-w-sm">{{ text }}</p>{% endif %}
  {% if action_url %}
  <a href="{{ action_url }}" class="mt-5 inline-flex items-center gap-2 px-5 h-11 rounded-full bg-[var(--soft)] text-[var(--ink)] font-medium hover:brightness-95 transition">{{ action_label }}</a>
  {% endif %}
  {% if action_button %}
  <button type="button" data-open-create class="mt-5 inline-flex items-center gap-2 px-5 h-11 rounded-full bg-brand hover:bg-brand-hover text-white font-medium shadow-primary transition">
    <i data-lucide="plus" class="w-[18px] h-[18px]"></i>
    {{ action_button }}
  </button>
  {% endif %}
</div>
