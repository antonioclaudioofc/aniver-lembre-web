{% load static %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var dark = stored
        ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
<link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}" />
<link rel="alternate icon" type="image/png" href="{% static 'images/favicon.png' %}" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="{% static 'js/tailwind.config.js' %}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="{% static 'css/style.css'%}" />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
/>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  window.toggleEye = function (el, showing) {
    if (!el) return;
    var c = el.children;
    if (c.length < 2) return;
    c[0].classList.toggle('hidden', !showing);
    c[1].classList.toggle('hidden', showing);
  };

  window.showAppToast = function (message, type, action) {
    var palette = {
      success: ['#3CCFAE', '✓'],
      danger: ['#FF7A59', '!'],
      warning: ['#FFC857', '!'],
      info: ['#A9A6FF', 'i'],
    };
    var tone = palette[type] || palette.info;

    if (window.__appToast) {
      window.__appToast.hideToast();
    }

    var node = document.createElement('div');
    node.style.cssText = 'display:flex;align-items:center;gap:12px';

    var icon = document.createElement('span');
    icon.textContent = tone[1];
    icon.setAttribute('aria-hidden', 'true');
    icon.style.cssText =
      'display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;font-size:13px;font-weight:700;color:#1C1B2E;flex-shrink:0;background:' +
      tone[0];

    var text = document.createElement('span');
    text.textContent = message;

    node.appendChild(icon);
    node.appendChild(text);

    if (action && action.label) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = action.label;
      btn.style.cssText =
        'margin-left:4px;font-weight:600;text-decoration:underline;color:inherit';
      btn.addEventListener('click', function () {
        if (action.onClick) action.onClick();
        if (window.__appToast) window.__appToast.hideToast();
      });
      node.appendChild(btn);
    }

    window.__appToast = Toastify({
      node: node,
      duration: action ? 5000 : 2500,
      gravity: 'top',
      position: 'right',
      close: true,
      className: 'al-toast',
      stopOnFocus: true,
      ariaLive: 'polite',
    });
    window.__appToast.showToast();
  };
</script>
<script defer src="{% static 'js/app.js' %}"></script>
<title>Aniver Lembre</title>
