{% load static %}
<aside class="hidden lg:flex lg:flex-col w-64 flex-shrink-0 h-screen sticky top-0 border-r border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-900">
  <div
    class="px-5 py-5 border-b border-gray-100 dark:border-gray-700 flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity"
    onclick="location.href='{% url 'panel:overview' %}'"
  >
    <img src="{% static 'images/logo.svg' %}" alt="Logo" class="w-8 h-8 flex-shrink-0" />
    <div class="min-w-0">
      <p class="font-semibold text-gray-900 dark:text-gray-100 leading-tight truncate">AniverLembre</p>
      <span class="inline-block text-xs font-semibold px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300">
        Admin
      </span>
    </div>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-1">
    <a
      href="{% url 'panel:overview' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'overview' %}bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300{% else %}text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800{% endif %}"
    >
      <span class="material-symbols-outlined text-xl">dashboard</span>
      Visão geral
    </a>
    <a
      href="{% url 'panel:users' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'users' %}bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300{% else %}text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800{% endif %}"
    >
      <span class="material-symbols-outlined text-xl">group</span>
      Usuários
    </a>
    <a
      href="{% url 'panel:reminders' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'reminders' %}bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300{% else %}text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800{% endif %}"
    >
      <span class="material-symbols-outlined text-xl">notifications_active</span>
      Lembretes
    </a>
  </nav>

  <div class="px-3 py-4 border-t border-gray-100 dark:border-gray-700 space-y-1">
    <a
      href="{% url 'dashboard:index' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
    >
      <span class="material-symbols-outlined text-xl">arrow_back</span>
      Voltar ao site
    </a>
    <a
      href="{% url 'accounts:logout' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950 transition-colors"
    >
      <span class="material-symbols-outlined text-xl">logout</span>
      Sair
    </a>
  </div>
</aside>

<div class="lg:hidden w-full border-b border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm sticky top-0 z-40">
  <div class="px-4">
    <div class="flex items-center justify-between py-3">
      <div
        class="flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity text-gray-900 dark:text-gray-100"
        onclick="location.href='{% url 'panel:overview' %}'"
      >
        <img src="{% static 'images/logo.svg' %}" alt="Logo" class="w-7 h-7" />
        <span class="font-semibold">AniverLembre</span>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300">
          Admin
        </span>
      </div>
      <div class="flex items-center gap-3">
        <a
          href="{% url 'dashboard:index' %}"
          class="flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors"
        >
          <span class="material-symbols-outlined text-lg">arrow_back</span>
          Site
        </a>
        <a
          href="{% url 'accounts:logout' %}"
          class="flex items-center gap-1 text-sm text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors"
        >
          <span class="material-symbols-outlined text-lg">logout</span>
          Sair
        </a>
      </div>
    </div>
    <div class="flex items-center gap-1 overflow-x-auto -mb-px">
      <a
        href="{% url 'panel:overview' %}"
        class="flex-shrink-0 px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if active_tab == 'overview' %}border-indigo-600 text-indigo-600 dark:text-indigo-400{% else %}border-transparent text-gray-500 dark:text-gray-400{% endif %}"
        >Visão geral</a
      >
      <a
        href="{% url 'panel:users' %}"
        class="flex-shrink-0 px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if active_tab == 'users' %}border-indigo-600 text-indigo-600 dark:text-indigo-400{% else %}border-transparent text-gray-500 dark:text-gray-400{% endif %}"
        >Usuários</a
      >
      <a
        href="{% url 'panel:reminders' %}"
        class="flex-shrink-0 px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if active_tab == 'reminders' %}border-indigo-600 text-indigo-600 dark:text-indigo-400{% else %}border-transparent text-gray-500 dark:text-gray-400{% endif %}"
        >Lembretes</a
      >
    </div>
  </div>
</div>
