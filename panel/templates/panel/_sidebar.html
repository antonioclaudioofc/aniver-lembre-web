{% load static %}
<aside class="hidden lg:flex lg:flex-col w-64 flex-shrink-0 h-screen sticky top-0 border-r border-[var(--line)] bg-[var(--surface)]">
  <div
    class="px-5 py-5 border-b border-[var(--line)] flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity"
    onclick="location.href='{% url 'panel:overview' %}'"
  >
    <img src="{% static 'images/logo.svg' %}" alt="Logo" class="w-8 h-8 flex-shrink-0" />
    <div class="min-w-0">
      <p class="font-semibold text-[var(--ink)] leading-tight truncate">AniverLembre</p>
      <span class="inline-block text-xs font-semibold px-1.5 py-0.5 rounded bg-[var(--brand-tint)] text-[var(--brand-text)]">
        Admin
      </span>
    </div>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-1">
    <a
      href="{% url 'panel:overview' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'overview' %}bg-[var(--brand-tint)] text-[var(--brand-text)]{% else %}text-[var(--muted)] hover:bg-[var(--soft)]{% endif %}"
    >
      <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
      Visão geral
    </a>
    <a
      href="{% url 'panel:users' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'users' %}bg-[var(--brand-tint)] text-[var(--brand-text)]{% else %}text-[var(--muted)] hover:bg-[var(--soft)]{% endif %}"
    >
      <i data-lucide="users" class="w-5 h-5"></i>
      Usuários
    </a>
    <a
      href="{% url 'panel:reminders' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_tab == 'reminders' %}bg-[var(--brand-tint)] text-[var(--brand-text)]{% else %}text-[var(--muted)] hover:bg-[var(--soft)]{% endif %}"
    >
      <i data-lucide="bell-ring" class="w-5 h-5"></i>
      Lembretes
    </a>
  </nav>

  <div class="px-3 py-4 border-t border-[var(--line)] space-y-1">
    <a
      href="{% url 'dashboard:index' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--muted)] hover:bg-[var(--soft)] transition-colors"
    >
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
      Voltar ao site
    </a>
    <a
      href="{% url 'accounts:logout' %}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--danger)] hover:bg-[var(--danger)]/10 transition-colors"
    >
      <i data-lucide="log-out" class="w-5 h-5"></i>
      Sair
    </a>
  </div>
</aside>

<div class="lg:hidden w-full border-b border-[var(--line)] bg-[var(--surface)] shadow-sm sticky top-0 z-40">
  <div class="px-4">
    <div class="flex items-center justify-between py-3">
      <div
        class="flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity text-[var(--ink)]"
        onclick="location.href='{% url 'panel:overview' %}'"
      >
        <img src="{% static 'images/logo.svg' %}" alt="Logo" class="w-7 h-7" />
        <span class="font-semibold">AniverLembre</span>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-[var(--brand-tint)] text-[var(--brand-text)]">
          Admin
        </span>
      </div>
      <div class="flex items-center gap-3">
        <a
          href="{% url 'dashboard:index' %}"
          class="flex items-center gap-1 text-sm text-[var(--muted)] hover:text-[var(--ink)] transition-colors"
        >
          <i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i>
          Site
        </a>
        <a
          href="{% url 'accounts:logout' %}"
          class="flex items-center gap-1 text-sm text-[var(--danger)] hover:text-[var(--danger)] transition-colors"
        >
          <i data-lucide="log-out" class="w-[18px] h-[18px]"></i>
          Sair
        </a>
      </div>
    </div>
    <div class="flex items-center gap-1 overflow-x-auto -mb-px">
      <a
        href="{% url 'panel:overview' %}"
        class="flex-shrink-0 px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if active_tab == 'overview' %}border-brand text-[var(--brand-text)]{% else %}border-transparent text-[var(--muted)]{% endif %}"
        >Visão geral</a
      >
      <a
        href="{% url 'panel:users' %}"
        class="flex-shrink-0 px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if active_tab == 'users' %}border-brand text-[var(--brand-text)]{% else %}border-transparent text-[var(--muted)]{% endif %}"
        >Usuários</a
      >
      <a
        href="{% url 'panel:reminders' %}"
        class="flex-shrink-0 px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if active_tab == 'reminders' %}border-brand text-[var(--brand-text)]{% else %}border-transparent text-[var(--muted)]{% endif %}"
        >Lembretes</a
      >
    </div>
  </div>
</div>
